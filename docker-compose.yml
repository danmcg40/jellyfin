services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - media_net
    user: "1000:10"
    ports:
      - "8096:8096"
    volumes:
      - /volume4/docker/jellyfin/config:/config
      - /volume4/docker/jellyfin/cache:/cache
      - /volume1/Media/movies:/media/movies:ro
      - /volume1/Media/shows:/media/shows:ro
      - /volume2/danmedia:/media/danmedia:ro
    environment:
      - TZ=America/New_York
      - JELLYFIN_CPU_THREADS=2
    restart: unless-stopped

  tunarr:
    image: chrisbenincasa/tunarr:1.0.18
    container_name: tunarr
    networks:
      - media_net
    ports:
      - "8000:8000"
    volumes:
      - /volume4/docker/tunarr/config:/config
      - /volume1/Media/movies:/media/movies:ro
      - /volume1/Media/shows:/media/shows:ro
      - /volume2/danmedia/danmedia:/media/danmedia:ro
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync on DXP2800
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=10
      - TUNARR_DEFAULT_TRANSCODE_VIDEO_RESOLUTION=1920x1080
      - TUNARR_DEFAULT_TRANSCODE_VIDEO_BITRATE=2200k
      - TUNARR_DEFAULT_TRANSCODE_AUDIO_BITRATE=160k
      - TUNARR_RESOLUTION=1920x1080
      - TUNARR_FPS=30
      - TUNARR_KEYFRAME_INTERVAL=2
      - TUNARR_ADAPTIVE_BITRATE=true
      - TUNARR_BUFFER_MS=1000
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Paris
    volumes:
      - /volume4/docker/jellyseerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /volume4/docker/radarr/config:/config
      - /volume1/Media/movies:/movies
      - /volume1/Downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /volume4/docker/sonarr/config:/config
      - /volume1/Media/shows:/tv
      - /volume1/Downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /volume4/docker/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - /volume4/docker/qbittorrent/config:/config
      - /volume1/Downloads:/downloads
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /volume4/docker/bazarr/config:/config
      - /volume1/Media/movies:/movies
      - /volume1/Media/shows:/tv
    ports:
      - 6767:6767
    restart: unless-stopped

networks:
  media_net:
    driver: bridge
